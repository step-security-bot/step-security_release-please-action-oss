name: 'CI'

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: 'false'

      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install NodeJS dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  lint:
    name: 'Lint'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: 'false'

      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install NodeJS dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  format:
    name: 'Format'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: 'false'
      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
      - name: Install NodeJS dependencies
        run: npm ci
      - name: Format
        run: npm run fmt:check

  build:
    name: 'Build'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - name: Setup Node environment
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
      - name: Install NodeJS dependencies
        run: npm ci
      - name: Run build
        run: npm run build
